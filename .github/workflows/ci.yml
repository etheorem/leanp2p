name: CI

# W0.2: build the tree and run the checks on every push and pull
# request. The steps run the build, both scheduler modes, the import
# lint, the CLI driver checks and the provenance check.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The cap ends a deadlocked suite before the 360-minute default would.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install just
        # The etheorem vendor recipes use the `[group]` attribute. The
        # `just` of the Ubuntu archive (1.21) rejects it. etheorem's own
        # CI uses this installer.
        uses: extractions/setup-just@v3

      - name: Install elan and the toolchain
        # This step installs the toolchain and nothing else. The gates
        # run as plain steps below, so the pin fetch comes between the
        # toolchain and the build. elan reads the version from
        # lean-toolchain.
        uses: leanprover/lean-action@v1
        with:
          auto-config: false

      - name: Fetch the etheorem pins and their native sources
        # Any Lake command loads the workspace and clones the pinned
        # packages. `lake env true` does that and nothing else. The
        # script then runs the monorepo's own vendor recipes in each
        # clone (packages/crypto/backend/docs/PLAN.md, milestones for
        # 1a). The OpenSSL 3 headers of the backend shim come from
        # libssl-dev, which the runner image carries.
        run: |
          lake env true
          scripts/hazmat-vendor.sh

      - name: Run lake build
        run: lake build

      - name: Run lake test
        run: lake test

      - name: Run lake test -- +RTS -N1 -RTS
        # The suite must keep passing under +RTS -N1, the starvation
        # criterion (docs/ARCHITECTURE.md §6). One capability must
        # leave no test starved.
        run: lake test -- +RTS -N1 -RTS

      - name: Run the import lint
        # scripts/lint-imports.sh enforces the group chain (cli →
        # libp2p → net → crypto → codec → base), the
        # no-libp2p-below-libp2p rule
        # (docs/ARCHITECTURE.md §2, docs/PRINCIPLES.md 4.3), and the
        # within-group downward orders with the §3.1 carve-out
        # (docs/ARCHITECTURE.md §2, §3.1).
        run: scripts/lint-imports.sh

      - name: Check the CLI interop driver
        # Unit checks of deadlines, readiness and process cleanup.
        # These do not run or replace the live networking gate.
        run: python3 -m unittest discover -s scripts -p test_ping_interop.py

      - name: Verify vector provenance
        # The step reruns the extractor over the pinned vendor copies
        # and diffs the corpus, so the committed JSON regenerates
        # byte-for-byte from the pinned sources (VECTORS.lock). The
        # status check catches a modified or an untracked corpus file,
        # which a plain diff of tracked files would miss. The clones
        # need network.
        run: |
          scripts/vendor-pull.sh --verify
          python3 scripts/extract-vectors.py
          test -z "$(git status --porcelain -- Tests/vectors)" || {
            echo "::error::Tests/vectors is stale; re-run scripts/extract-vectors.py"
            exit 1
          }

  snappy-native-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install elan and the toolchain
        # The step installs the pinned toolchain and nothing else.
        # elan reads the version from lean-toolchain. The hardening
        # script runs the Snappy audit and the sanitizer pair. It does
        # not run the vector provenance check.
        uses: leanprover/lean-action@v1
        with:
          auto-config: false

      - name: Audit native symbols and sanitizers
        run: python3 -u packages/codec/snappy/scripts/linux-hardening.py
