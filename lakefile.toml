# Every library takes the Lake default globs: the root module only
# (`roots.map Glob.one`). A unit that adds the first submodule widens its
# glob to `X.*` in the same commit. `X.*` reads the `X/` directory, and
# the load fails while the directory does not exist (`Glob.forEachModuleIn`).
# The root re-exports every public submodule, so the default builds the
# public surface until then.
name = "leanp2p"
defaultTargets = [
  "Conc",
  "Bytes",
  "Varint",
  "Multiformats",
  "Proto",
  "Snappy",
  "Crypto",
  "CryptoPure",
  "Streams",
  "Yamux",
  "Libp2pIdentity",
  "Libp2pCore",
  "Libp2pSecurity",
  "Libp2pMux",
  "Libp2pNegotiate",
  "Libp2pHost",
  "Libp2pProtocols",
  "CliHarness",
  "demo",
  "pingnode",
  "Tests",
]
# `lake test` builds and runs the executable named here.
testDriver = "tests"
# `crypto/backend` is a nested Lake package. Its `lakefile.lean` builds
# the C shim, which the declarative form cannot express (CLAUDE.md,
# "Configure, don't integrate"). It provides the `Backend` library. The
# `Tests` library imports it, so `lake build` builds it.
# The executables need no link argument for the shim. The toolchain
# links its own static OpenSSL 3 `libcrypto.a` into every executable,
# and the shim archive resolves against that copy.
[[require]]
name = "InteropHostname"
path = "packages/cli/hostname"

[[require]]
name = "Backend"
path = "packages/crypto/backend"

# `net/tls/native` is a nested Lake package for the same reason: the
# libssl shim of `net/tls`. It links against the toolchain's static
# `libssl.a` and `libcrypto.a`.
[[require]]
name = "TlsNative"
path = "packages/net/tls/native"

# `net/streams/shim` is a nested Lake package for the same reason. Its
# `lakefile.lean` builds the C abort of the TCP transport. It provides
# the `StreamsShim` library, and it links against the toolchain's own
# `libuv.a`.
[[require]]
name = "StreamsShim"
path = "packages/net/streams/shim"

# The etheorem hazmat pins (root ARCHITECTURE §4.6, PLAN W3.2). Each is
# one single-family package, never the `LeanHazmat` umbrella, so the
# build compiles only the families it uses. All sit at one monorepo
# rev. Two need their native sources before `lake build`: run
# `scripts/hazmat-vendor.sh` once after Lake clones them.
# `LeanHazmatSha256` is not pinned. At this rev its archive replaces the
# startup hook that runs the static constructors. An executable that
# links it crashes on its first error print. SHA-256 falls back to the
# backend binding (packages/crypto/backend/docs/PLAN.md, "Pin outcomes").
[[require]]
name = "LeanHazmatKeccak"
git = "https://github.com/etheorem/etheorem"
rev = "169cf718a7d149a2973aa4e6468994720a6f356e"
subDir = "packages/hazmat/LeanHazmatKeccak"

[[require]]
name = "LeanHazmatP256"
git = "https://github.com/etheorem/etheorem"
rev = "169cf718a7d149a2973aa4e6468994720a6f356e"
subDir = "packages/hazmat/LeanHazmatP256"

[[require]]
name = "LeanHazmatSecp256k1"
git = "https://github.com/etheorem/etheorem"
rev = "169cf718a7d149a2973aa4e6468994720a6f356e"
subDir = "packages/hazmat/LeanHazmatSecp256k1"

# Argument parsing for the demo and the ping node. Tag `v4.34.0`
# (`e92c9f15fdfacc8536f31cfb3b7ad26c3c8cd204`). The package, its lib,
# and its root module are named `Cli`, so the nominal lib below is
# `CliHarness`.
[[require]]
name = "Cli"
git = "https://github.com/leanprover/lean4-cli"
rev = "e92c9f15fdfacc8536f31cfb3b7ad26c3c8cd204"

# The native helper builds the Snappy static archive. This file stays
# the root configuration. The helper adds no Lean library.
[[require]]
name = "snappyNative"
path = "packages/codec/snappy/native"

[[lean_lib]]
name = "Conc"
srcDir = "packages/base/conc"
roots = ["Conc"]
globs = ["Conc.*"]

[[lean_lib]]
name = "Bytes"
srcDir = "packages/base/bytes"
globs = ["Bytes.*"]

[[lean_lib]]
name = "Varint"
srcDir = "packages/codec/varint"
roots = ["Varint"]
globs = ["Varint.*"]

[[lean_lib]]
name = "Multiformats"
srcDir = "packages/codec/multiformats"
roots = ["Multiformats"]
globs = ["Multiformats.*"]

[[lean_lib]]
name = "Proto"
srcDir = "packages/codec/proto"
roots = ["Proto"]
globs = ["Proto.*"]

[[lean_lib]]
name = "Snappy"
srcDir = "packages/codec/snappy"
roots = ["Snappy"]
# The library waits for the production block-only archive and links it.
needs = ["snappyNative/snappy"]
moreLinkObjs = ["snappyNative/snappy"]

[[lean_lib]]
name = "Crypto"
srcDir = "packages/crypto"
roots = ["Crypto"]
globs = ["Crypto.*"]

[[lean_lib]]
name = "CryptoPure"
srcDir = "packages/crypto/pure"
roots = ["CryptoPure"]
globs = ["CryptoPure.*"]

[[lean_lib]]
name = "Streams"
srcDir = "packages/net/streams"
roots = ["Streams"]
globs = ["Streams.*"]

[[lean_lib]]
name = "Yamux"
srcDir = "packages/net/yamux"
roots = ["Yamux"]
globs = ["Yamux.*"]

[[lean_lib]]
name = "Tls"
srcDir = "packages/net/tls"
roots = ["Tls"]
globs = ["Tls.*"]

[[lean_lib]]
name = "Libp2pIdentity"
srcDir = "packages/libp2p/identity"
roots = ["Libp2p.Identity"]
globs = ["Libp2p.Identity.*"]

[[lean_lib]]
name = "Libp2pCore"
srcDir = "packages/libp2p/core"
roots = ["Libp2p.Core"]
globs = ["Libp2p.Core.*"]

[[lean_lib]]
name = "Libp2pSecurity"
srcDir = "packages/libp2p/security"
roots = ["Libp2p.Security"]
globs = ["Libp2p.Security.*"]

[[lean_lib]]
name = "Libp2pMux"
srcDir = "packages/libp2p/mux"
roots = ["Libp2p.Mux"]
globs = ["Libp2p.Mux.*"]

[[lean_lib]]
name = "Libp2pNegotiate"
srcDir = "packages/libp2p/negotiate"
roots = ["Libp2p.Negotiate"]
globs = ["Libp2p.Negotiate.*"]

[[lean_lib]]
name = "Libp2pHost"
srcDir = "packages/libp2p/host"
roots = ["Libp2p.Host"]
globs = ["Libp2p.Host.*"]

[[lean_lib]]
name = "Libp2pProtocols"
srcDir = "packages/libp2p/protocols"
roots = ["Libp2p.Protocols"]
globs = ["Libp2p.Protocols.*"]

[[lean_lib]]
name = "CliHarness"
srcDir = "packages/cli"
roots = ["CliHarness", "Demo", "PingNode", "Interop", "GossipsubInterop", "GossipsubSession"]
globs = ["CliHarness", "Demo", "PingNode", "Interop.*", "GossipsubInterop", "GossipsubSession"]

# The transport-interop harness of root PLAN W5.9.
[[lean_exe]]
name = "interop"
srcDir = "packages/cli"
root = "Interop.Main"

# The test tree: one suite module per upstream file, with the shared
# runner in `Tests/Support.lean`. The `tests` executable is the
# `lake test` driver. `Tests.+` is Lake's TOML spelling of
# `.submodules `Tests` (the spike's glob); `Tests.*` would be
# `.andSubmodules`, and the `Tests.lean` root it asks for does not exist.
[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

[[lean_exe]]
name = "tests"
root = "Tests.Main"

# The Lean side of the yamux interop check against go-yamux; run it
# through `scripts/yamux-interop.sh`. It is not part of `lake test`,
# which stays free of Go tooling.
[[lean_exe]]
name = "yamux-interop"
root = "Tests.Interop.Yamux"

# The Lean side of the mplex interop check against go-mplex; run it
# through `scripts/mplex-interop.sh`. Like `yamux-interop`, it is not
# part of `lake test`.
[[lean_exe]]
name = "mplex-interop"
root = "Tests.Interop.Mplex"

# The Lean side of the Noise interop check against go-libp2p's Noise
# transport; run it through `scripts/noise-interop.sh`. Like
# `yamux-interop`, it is not part of `lake test`.
[[lean_exe]]
name = "noise-interop"
root = "Tests.Interop.Noise"

# The Lean side of the TLS interop check against go-libp2p's TLS
# transport; run it through `scripts/tls-interop.sh`. Like
# `noise-interop`, it is not part of `lake test`.
[[lean_exe]]
name = "tls-interop"
root = "Tests.Interop.Tls"

[[lean_exe]]
name = "gossipsub-interop"
srcDir = "packages/cli"
root = "Main"

[[lean_exe]]
name = "demo"
srcDir = "packages/cli"
root = "Demo"

[[lean_exe]]
name = "pingnode"
srcDir = "packages/cli"
root = "PingNode"
