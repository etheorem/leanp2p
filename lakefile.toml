# Every library takes the Lake default globs: the root module only
# (`roots.map Glob.one`). A unit that adds the first submodule widens its
# glob to `X.*` in the same commit. `X.*` reads the `X/` directory, and
# the load fails while the directory does not exist (`Glob.forEachModuleIn`).
# The root re-exports every public submodule, so the default builds the
# public surface until then.
name = "leanp2p"
defaultTargets = [
  "Conc",
  "Bytes",
  "Varint",
  "Multiformats",
  "Proto",
  "Snappy",
  "Crypto",
  "CryptoPure",
  "Streams",
  "Yamux",
  "Libp2pIdentity",
  "Libp2pCore",
  "Libp2pSecurity",
  "Libp2pMux",
  "Libp2pNegotiate",
  "Libp2pHost",
  "Libp2pProtocols",
  "Cli",
  "Tests",
]
# `lake test` builds and runs the executable named here.
testDriver = "tests"
# `crypto/backend` is a nested Lake package. Its `lakefile.lean` builds
# the C shim, which the declarative form cannot express (CLAUDE.md,
# "Configure, don't integrate"). It provides the `Backend` library. The
# `Tests` library imports it, so `lake build` builds it.
# The executables need no link argument for the shim. The toolchain
# links its own static OpenSSL 3 `libcrypto.a` into every executable,
# and the shim archive resolves against that copy.
[[require]]
name = "Backend"
path = "packages/crypto/backend"

# The etheorem hazmat pins (root ARCHITECTURE §4.6, PLAN W3.2). Each is
# one single-family package, never the `LeanHazmat` umbrella, so the
# build compiles only the families it uses. All sit at one monorepo
# rev. Two need their native sources before `lake build`: run
# `scripts/hazmat-vendor.sh` once after Lake clones them.
# `LeanHazmatSha256` is not pinned. At this rev its archive replaces the
# startup hook that runs the static constructors. An executable that
# links it crashes on its first error print. SHA-256 falls back to the
# backend binding (packages/crypto/backend/docs/PLAN.md, "Pin outcomes").
[[require]]
name = "LeanHazmatKeccak"
git = "https://github.com/etheorem/etheorem"
rev = "169cf718a7d149a2973aa4e6468994720a6f356e"
subDir = "packages/hazmat/LeanHazmatKeccak"

[[require]]
name = "LeanHazmatP256"
git = "https://github.com/etheorem/etheorem"
rev = "169cf718a7d149a2973aa4e6468994720a6f356e"
subDir = "packages/hazmat/LeanHazmatP256"

[[require]]
name = "LeanHazmatSecp256k1"
git = "https://github.com/etheorem/etheorem"
rev = "169cf718a7d149a2973aa4e6468994720a6f356e"
subDir = "packages/hazmat/LeanHazmatSecp256k1"

[[lean_lib]]
name = "Conc"
srcDir = "packages/base/conc"
roots = ["Conc"]
globs = ["Conc.*"]

[[lean_lib]]
name = "Bytes"
srcDir = "packages/base/bytes"
globs = ["Bytes.*"]

[[lean_lib]]
name = "Varint"
srcDir = "packages/codec/varint"
roots = ["Varint"]
globs = ["Varint.*"]

[[lean_lib]]
name = "Multiformats"
srcDir = "packages/codec/multiformats"
roots = ["Multiformats"]

[[lean_lib]]
name = "Proto"
srcDir = "packages/codec/proto"
roots = ["Proto"]
globs = ["Proto.*"]

[[lean_lib]]
name = "Snappy"
srcDir = "packages/codec/snappy"
roots = ["Snappy"]

[[lean_lib]]
name = "Crypto"
srcDir = "packages/crypto"
roots = ["Crypto"]

[[lean_lib]]
name = "CryptoPure"
srcDir = "packages/crypto/pure"
roots = ["CryptoPure"]
globs = ["CryptoPure.*"]

[[lean_lib]]
name = "Streams"
srcDir = "packages/net/streams"
roots = ["Streams"]
globs = ["Streams.*"]

[[lean_lib]]
name = "Yamux"
srcDir = "packages/net/yamux"
roots = ["Yamux"]

[[lean_lib]]
name = "Libp2pIdentity"
srcDir = "packages/libp2p/identity"
roots = ["Libp2p.Identity"]

[[lean_lib]]
name = "Libp2pCore"
srcDir = "packages/libp2p/core"
roots = ["Libp2p.Core"]

[[lean_lib]]
name = "Libp2pSecurity"
srcDir = "packages/libp2p/security"
roots = ["Libp2p.Security"]

[[lean_lib]]
name = "Libp2pMux"
srcDir = "packages/libp2p/mux"
roots = ["Libp2p.Mux"]

[[lean_lib]]
name = "Libp2pNegotiate"
srcDir = "packages/libp2p/negotiate"
roots = ["Libp2p.Negotiate"]

[[lean_lib]]
name = "Libp2pHost"
srcDir = "packages/libp2p/host"
roots = ["Libp2p.Host"]

[[lean_lib]]
name = "Libp2pProtocols"
srcDir = "packages/libp2p/protocols"
roots = ["Libp2p.Protocols"]

[[lean_lib]]
name = "Cli"
srcDir = "packages/cli"
roots = ["Cli"]

# The test tree: one suite module per upstream file, with the shared
# runner in `Tests/Support.lean`. The `tests` executable is the
# `lake test` driver. `Tests.+` is Lake's TOML spelling of
# `.submodules `Tests` (the spike's glob); `Tests.*` would be
# `.andSubmodules`, and the `Tests.lean` root it asks for does not exist.
[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

[[lean_exe]]
name = "tests"
root = "Tests.Main"
